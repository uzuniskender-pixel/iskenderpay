<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0e17">
<meta name="mobile-web-app-capable" content="yes\">\n<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ödeme">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ödeme Takvimi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="MAIN_GRID">
  </div>

<div id="AI">
  </div>

<div class="mov" id="SRCHMOD">
  <div class="modal">
    <div class="mhdl"></div>
    <h2>Verilerde <span>Ara</span></h2>
    <div style="margin-bottom:15px;">
      <input id="SRCHINP" type="text" placeholder="Kelime, kişi veya tutar yazın..." style="width:100%; padding:14px; border-radius:10px; background:rgba(0,0,0,0.2); color:#fff; border:1px solid rgba(255,255,255,0.15); font-size:15px; outline:none; box-sizing: border-box;">
    </div>
    <div id="SRCHRES" style="max-height: 280px; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 6px; padding-right:5px;">
      <div style="text-align: center; opacity: 0.5; padding: 20px 0; color:#fff; font-size:14px;">Yazmaya başlayın...</div>
    </div>
    <div style="margin-top: 15px;">
      <button class="btn bc" data-modal-close="SRCHMOD" onclick="document.getElementById('SRCHMOD').classList.remove('open')">Kapat</button>
    </div>
  </div>
</div>

<div class="mov" id="HIMOD">
  <div class="modal">
    <div class="mhdl"></div>
    <h2>Geçmiş <span>Düzenle</span></h2>
    <input type="hidden" id="HIIDX">
    <div class="fg"><label class=\"fl\">Ödeme Adı</label><input class="fi" id="HINAM" type="text" placeholder="Kira, Elektrik..."></div>
    <div class="fg"><label class=\"fl\">Tutar (₺)</label><input class="fi mono-inp" id="HIAMT" type="number" min="0" step="0.01" placeholder="0.00"></div>
    <div class="fg"><label class=\"fl\">Tarih</label><input class="fi" id="HIDAT" type="date"></div>
    <div class="brow"><button class="btn bc" data-modal-close="HIMOD" onclick="document.getElementById('HIMOD').classList.remove('open')">İptal</button><button class="btn bs" onclick="window.saveHistItem ? window.saveHistItem() : null">Kaydet</button></div>
  </div>
</div>

<div id="sync-toast">🔄 Senkronize edildi</div>
<div id="upd-banner">
  <div class="upd-txt">🔄 Yeni sürüm mevcut</div>
  <button class="upd-btn" onclick="window.updApply()">Güncelle</button>
</div>

<script>
  // Arayüz fallback sabiti
  const APP_VERSION = 'v8.16';
</script>

<script type="module" src="js/app.js"></script>

<script>
  // PWA Service Worker Bağlantısı
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[PWA] Service Worker başarıyla bağlandı.'))
        .catch(err => console.error('[PWA] SW Bağlantı hatası:', err));
    });
  }
</script>
</body>
</html>
