name: Auto Tag on Push

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version.json'dan versiyon oku
        id: version
        run: |
          VERSION=$(jq -r '.v' version.json)
          BUILD=$(jq -r '.build' version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${BUILD}" >> $GITHUB_OUTPUT

      - name: Tag zaten var mi kontrol et
        id: check
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag olustur ve push et
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.version.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "iskenderpay $TAG"
          git push origin "$TAG"