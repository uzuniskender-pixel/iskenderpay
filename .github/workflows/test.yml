name: Tests

on:
  workflow_dispatch:   # push/PR tetigi kaldirildi; dev monorepo'ya tasindi. Elle Run kaldi.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bagimliliklari yukle
        run: npm install --no-audit --no-fund

      - name: Birim testleri (vitest)
        run: npm test
