<div id="ARAMAMODAL" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999999; font-family: sans-serif;">
  <div style="max-width: 500px; width: 90%; background: #1f2833; padding: 25px; border-radius: 20px; border: 1px solid rgba(102, 252, 241, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.7); box-sizing: border-box;">
    <h2 style="margin-top:0; margin-bottom:20px; color:#fff; font-size:22px; font-weight:600;">Verilerde <span style="color:#66fcf1;">Ara</span></h2>
    <div style="margin-bottom:15px;">
      <input id="SRCHINP" type="text" placeholder="Kelime, kişi veya tutar yazın..." oninput="parent.execGlobalSearch()" style="width:100%; padding:14px; border-radius:10px; background:rgba(0,0,0,0.2); color:#fff; border:1px solid rgba(255,255,255,0.15); font-size:15px; outline:none; box-sizing: border-box;">
    </div>
    <div id="SRCHRES" style="max-height: 280px; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 6px; padding-right:5px;">
      <div style="text-align: center; opacity: 0.5; padding: 20px 0; color:#fff; font-size:14px;">Yazmaya başlayın...</div>
    </div>
    <div style="margin-top: 20px; display:flex; justify-content:flex-end;">
      <button onclick="document.getElementById('ARAMAMODAL').style.display='none'; parent.document.getElementById('ARAMAMODAL_FRAME').style.display='none';" style="cursor:pointer; padding:10px 22px; background:#ff4d4d; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:14px;">Kapat</button>
    </div>
  </div>
</div>

<button onclick="document.getElementById('ARAMAMODAL').style.display='flex'; setTimeout(() => document.getElementById('SRCHINP').focus(), 100);" 
        style="position: fixed; bottom: 85px; right: 20px; z-index: 99998; background: #66fcf1; color: #0b0c10; border: none; padding: 12px 20px; font-weight: bold; font-size: 14px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: sans-serif;">
  🔍 Ara
</button>
